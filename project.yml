name: NeteaseMusicDownloader

options:
  bundleIdPrefix: com.mofan2020
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  NeteaseMusicDownloader:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mofan2020.neteasemusicdownloader
        PRODUCT_NAME: NeteaseMusicDownloader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/NeteaseMusicDownloader.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_CFBundleName: NeteaseMusicDownloader
        INFOPLIST_KEY_CFBundleDisplayName: 网易云音乐
        INFOPLIST_KEY_CFBundleIdentifier: com.mofan2020.neteasemusicdownloader
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Skyc8266"
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        # i18n: 让 Info.plist 声明支持的语言，Localizable.lproj 才会被 bundle 加载
        INFOPLIST_KEY_CFBundleLocalizations: ["en", "zh-Hans"]
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

configs:
  Debug: debug
  Release: release
